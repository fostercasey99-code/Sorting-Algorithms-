/* ══════════════════════════════════════════
   MERGE SORT
══════════════════════════════════════════ */
let msData=[], msSteps=[], msStepIdx=0, msSpeed=600, msAutoRunning=false, msAnimReq=null;
const MS_COLORS={
  default:'rgba(79,142,247,.7)',
  sorted:'rgba(62,201,160,.7)',
  comparing:'rgba(240,160,48,.9)',
  swapping:'rgba(159,126,247,.9)',
  left:'rgba(79,142,247,.85)',
  right:'rgba(240,96,80,.85)',
  merged:'rgba(62,201,160,.7)',
};

function msGenerate(){
  if(msAutoRunning){msAutoRunning=false;document.getElementById('ms-auto').textContent='Auto ▶';}
  const n=parseInt(document.getElementById('ms-size').value)||8;
  msData=Array.from({length:Math.min(Math.max(n,4),16)},()=>Math.floor(Math.random()*90)+10);
  msSteps=[];msStepIdx=0;
  msBuildSteps([...msData]);
  if(msSteps.length){msDraw(msData,msSteps[0]);updateDots('ms-dots',msSteps.length,0);}
  setLog('ms-log','Array generated. N='+msData.length+'. Merge sort splits the array in half repeatedly, then merges sorted halves back together.');
  document.getElementById('ms-prev').disabled=true;
  document.getElementById('ms-next').disabled=false;
  updateDots('ms-dots',msSteps.length,0);
  msHighlightPseudo(-1);
}

function msBuildSteps(arr){
  const orig=[...arr];
  const a=[...arr];
  const n=a.length;

  // Each group stores {lo, hi, status, bars:[{origIdx, val}]}
  // bars are the actual elements still in the group, with their snapshot values
  // origIdx is just for stable animation key — values come from bars[].val

  var currentMerged=[]; // bars placed into merged result so far in current merge operation

  function step(groups, msg, pseudoLine){
    msSteps.push({
      groups: groups.map(function(g){
        return{lo:g.lo, hi:g.hi, status:g.status, bars:g.bars.map(function(b){return{origIdx:b.origIdx,val:b.val};})};
      }),
      mergedBars: currentMerged.map(function(b){return{origIdx:b.origIdx,val:b.val};}),
      arr:[...a], msg:msg, pseudoLine:pseudoLine
    });
  }

  // initial bars: origIdx = array index, val = original value
  var initBars=orig.map(function(v,i){return{origIdx:i,val:v};});
  var currentGroups=[{lo:0,hi:n-1,status:'default',bars:[...initBars]}];
  step(currentGroups,'Starting merge sort. The array splits into smaller pieces, then merges back in sorted order.',-1);

  function mergeSort(lo,hi){
    if(hi<=lo) return;
    const mid=Math.floor(lo+(hi-lo)/2);
    var ng=[];
    currentGroups.forEach(function(g){
      if(g.lo===lo&&g.hi===hi){
        // split bars into left and right based on original position
        var leftBars=g.bars.filter(function(b){return b.origIdx<=mid;});
        var rightBars=g.bars.filter(function(b){return b.origIdx>mid;});
        ng.push({lo:lo,hi:mid,status:'left',bars:leftBars});
        ng.push({lo:mid+1,hi:hi,status:'right',bars:rightBars});
      } else {
        ng.push({lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]});
      }
    });
    currentGroups=ng;
    var leftVals=ng.find(function(g){return g.lo===lo&&g.hi===mid;}).bars.map(function(b){return b.val;});
    var rightVals=ng.find(function(g){return g.lo===mid+1&&g.hi===hi;}).bars.map(function(b){return b.val;});
    step(currentGroups,'Split ['+lo+'..'+hi+']: left ['+leftVals.join(',')+'] and right ['+rightVals.join(',')+
      ']. j = '+lo+' + ('+hi+' - '+lo+') / 2 = '+mid+'.',0);
    mergeSort(lo,mid);
    mergeSort(mid+1,hi);
    merge(lo,mid,hi);
  }

  function merge(lo,mid,hi){
    // reset merged display for this merge operation
    currentMerged=[];
    // get left and right bars from current state
    var leftGroup=currentGroups.find(function(g){return g.lo===lo&&g.hi===mid;});
    var rightGroup=currentGroups.find(function(g){return g.lo===mid+1&&g.hi===hi;});
    var leftBars=[...leftGroup.bars];
    var rightBars=[...rightGroup.bars];

    step(currentGroups.map(function(g){
      if(g.lo===lo&&g.hi===mid) return{lo:g.lo,hi:g.hi,status:'left',bars:[...leftBars]};
      if(g.lo===mid+1&&g.hi===hi) return{lo:g.lo,hi:g.hi,status:'right',bars:[...rightBars]};
      return{lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]};
    }),'Merge left ['+leftBars.map(function(b){return b.val;}).join(',')+'] and right ['+
      rightBars.map(function(b){return b.val;}).join(',')+'] into one sorted group.',1);

    var remLeft=[...leftBars];
    var remRight=[...rightBars];
    var mergedBars=[];

    while(remLeft.length&&remRight.length){
      // compare step
      step(currentGroups.map(function(g){
        if(g.lo===lo&&g.hi===mid) return{lo:g.lo,hi:g.hi,status:'comparing',bars:[...remLeft]};
        if(g.lo===mid+1&&g.hi===hi) return{lo:g.lo,hi:g.hi,status:'comparing',bars:[...remRight]};
        return{lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]};
      }),'Compare '+remLeft[0].val+' (left front) vs '+remRight[0].val+' (right front). '+
        (remLeft[0].val<=remRight[0].val?remLeft[0].val+' is smaller — take it.':remRight[0].val+' is smaller — take it.'),2);

      var taken;
      if(remLeft[0].val<=remRight[0].val){taken=remLeft.shift();}
      else{taken=remRight.shift();}
      mergedBars.push(taken);
      currentMerged.push(taken);
      a[lo+mergedBars.length-1]=taken.val;

      step(currentGroups.map(function(g){
        if(g.lo===lo&&g.hi===mid) return{lo:g.lo,hi:g.hi,status:'left',bars:[...remLeft]};
        if(g.lo===mid+1&&g.hi===hi) return{lo:g.lo,hi:g.hi,status:'right',bars:[...remRight]};
        return{lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]};
      }),'Took '+taken.val+'. Merged so far: ['+mergedBars.map(function(b){return b.val;}).join(',')+'].',3);
    }
    while(remLeft.length){
      var takenL=remLeft.shift();mergedBars.push(takenL);currentMerged.push(takenL);a[lo+mergedBars.length-1]=takenL.val;
      step(currentGroups.map(function(g){
        if(g.lo===lo&&g.hi===mid) return{lo:g.lo,hi:g.hi,status:'left',bars:[...remLeft]};
        if(g.lo===mid+1&&g.hi===hi) return{lo:g.lo,hi:g.hi,status:'right',bars:[]};
        return{lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]};
      }),'Right done — copied '+takenL.val+' from left. Merged: ['+mergedBars.map(function(b){return b.val;}).join(',')+'].',3);
    }
    while(remRight.length){
      var takenR=remRight.shift();mergedBars.push(takenR);currentMerged.push(takenR);a[lo+mergedBars.length-1]=takenR.val;
      step(currentGroups.map(function(g){
        if(g.lo===lo&&g.hi===mid) return{lo:g.lo,hi:g.hi,status:'left',bars:[]};
        if(g.lo===mid+1&&g.hi===hi) return{lo:g.lo,hi:g.hi,status:'right',bars:[...remRight]};
        return{lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]};
      }),'Left done — copied '+takenR.val+' from right. Merged: ['+mergedBars.map(function(b){return b.val;}).join(',')+'].',3);
    }

    // replace both groups with merged sorted group
    // reassign origIdxs in order lo..hi to keep them stable
    var sortedBars=mergedBars.map(function(b,i){return{origIdx:lo+i,val:b.val};});
    var mergedGroups=[],leftDone=false;
    currentGroups.forEach(function(g){
      if(g.lo===lo&&g.hi===mid&&!leftDone){
        mergedGroups.push({lo:lo,hi:hi,status:'sorted',bars:sortedBars});
        leftDone=true;
      } else if(g.lo===mid+1&&g.hi===hi&&leftDone){
        // skip
      } else {
        mergedGroups.push({lo:g.lo,hi:g.hi,status:g.status,bars:[...g.bars]});
      }
    });
    currentGroups=mergedGroups;
    currentMerged=[];
    step(currentGroups,'Merged! ['+lo+'..'+hi+'] is now sorted: ['+sortedBars.map(function(b){return b.val;}).join(',')+'].',4);
  }

  mergeSort(0,n-1);
  var finalBars=Array.from({length:n},function(_,i){return{origIdx:i,val:a[i]};});
  step([{lo:0,hi:n-1,status:'sorted',bars:finalBars}],'Done! Array fully sorted: ['+a.join(',')+'].',5);
}

function msDraw(arr,state){
  const canvasEl=document.getElementById('ms-c');if(!canvasEl)return;
  if(!state.groups||!state.groups.length)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvasEl.parentElement.clientWidth;
  const rowH=130,rowPad=24,totalH=rowPad+rowH+90+rowPad;
  if(canvasEl.width!==Math.round(W*dpr)||canvasEl.height!==Math.round(totalH*dpr)){
    canvasEl.width=Math.round(W*dpr);canvasEl.height=Math.round(totalH*dpr);
    canvasEl.style.width=W+'px';canvasEl.style.height=totalH+'px';
  }
  const ctx=canvasEl.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,totalH);

  // use original array for consistent max scaling
  const maxVal=Math.max.apply(null,(arr||[]).concat([1]));
  const pad=16,bGap=4,groupGap=14;

  var totalBars=0;
  state.groups.forEach(function(g){totalBars+=g.bars.length;});
  var numGroups=state.groups.filter(function(g){return g.bars.length>0;}).length;
  var totalGaps=(numGroups>1?(numGroups-1)*groupGap:0)+(totalBars>numGroups?(totalBars-numGroups)*bGap:0);
  var bw=totalBars>0?Math.max(12,Math.floor((W-pad*2-totalGaps)/totalBars)):20;

  var xCursor=pad;
  state.groups.forEach(function(g){
    if(!g.bars.length)return;
    var col=msGroupColor(g.status);
    var groupX=xCursor;
    g.bars.forEach(function(b){
      var v=b.val;
      var bh=Math.max(18,Math.round((v/maxVal)*(rowH-40)));
      var x=xCursor,y=rowPad+rowH-20-bh;
      ctx.save();ctx.fillStyle=col;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.roundRect(x,y,bw,bh,3);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle=col;ctx.font='500 '+(bw>24?11:9)+'px "DM Mono",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(v),x+bw/2,y-10);
      ctx.fillStyle='#454340';ctx.font='9px "DM Mono",monospace';
      ctx.fillText(String(b.origIdx),x+bw/2,rowPad+rowH-6);
      ctx.restore();
      xCursor+=bw+bGap;
    });
    if(g.bars.length>1){
      var gw=g.bars.length*(bw+bGap)-bGap;
      ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=.3;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(groupX,rowPad+rowH-2);ctx.lineTo(groupX+gw,rowPad+rowH-2);ctx.stroke();
      ctx.restore();
    }
    xCursor+=groupGap;
  });

  var items=[['sorted','rgba(62,201,160,.85)'],['left half','rgba(79,142,247,.85)'],['right half','rgba(240,96,80,.85)'],['comparing','rgba(240,160,48,.9)'],['merged','rgba(62,201,160,.6)']];
  var lx=pad;
  items.forEach(function(item){
    ctx.save();ctx.fillStyle=item[1];ctx.globalAlpha=.85;
    ctx.beginPath();ctx.roundRect(lx,4,8,8,2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#888785';ctx.font='9px "DM Mono",monospace';
    ctx.textAlign='left';ctx.fillText(item[0],lx+11,9);ctx.restore();
    lx+=ctx.measureText(item[0]).width+24;
  });

  // draw merged row if active
  if(state.mergedBars&&state.mergedBars.length){
    var mergedY=totalH-rowPad-10;
    ctx.save();ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='9px "DM Mono",monospace';
    ctx.textAlign='left';ctx.fillText('merged →',1,mergedY-16);ctx.restore();
    state.mergedBars.forEach(function(b,mi){
      var v=b.val;
      var bh=Math.max(18,Math.round((v/maxVal)*(rowH*0.4)));
      var x=pad+mi*(bw+bGap);
      var y=mergedY-bh;
      ctx.save();ctx.fillStyle='rgba(62,201,160,.8)';ctx.globalAlpha=.85;
      ctx.beginPath();ctx.roundRect(x,y,bw,bh,2);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='rgba(62,201,160,.85)';ctx.font='500 '+(bw>24?10:8)+'px "DM Mono",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(v),x+bw/2,y-6);
      ctx.restore();
    });
  }
}

function msGroupColor(status){
  if(status==='sorted') return 'rgba(62,201,160,.85)';
  if(status==='left') return 'rgba(79,142,247,.85)';
  if(status==='right') return 'rgba(240,96,80,.85)';
  if(status==='comparing') return 'rgba(240,160,48,.9)';
  return 'rgba(79,142,247,.55)';
}

function msBuildPosMap(groups, maxVal, W){
  const pad=16,bGap=4,groupGap=14;
  var totalBars=0;
  groups.forEach(function(g){totalBars+=g.bars.length;});
  var numGroups=groups.filter(function(g){return g.bars.length>0;}).length;
  var totalGaps=(numGroups>1?(numGroups-1)*groupGap:0)+(totalBars>numGroups?(totalBars-numGroups)*bGap:0);
  var bw=totalBars>0?Math.max(12,Math.floor((W-pad*2-totalGaps)/totalBars)):20;
  var map={};var xCursor=pad;
  groups.forEach(function(g){
    if(!g.bars.length)return;
    var col=msGroupColor(g.status);
    g.bars.forEach(function(b){
      // key by origIdx — stable across steps
      map[b.origIdx]={x:xCursor,bw:bw,col:col,val:b.val};
      xCursor+=bw+bGap;
    });
    xCursor+=groupGap;
  });
  return map;
}

function msAnimate(fromStep,toStep,dur,onDone){
  if(msAnimReq){cancelAnimationFrame(msAnimReq);msAnimReq=null;}
  const canvasEl=document.getElementById('ms-c');if(!canvasEl)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvasEl.parentElement.clientWidth;
  const rowH=130,rowPad=24,totalH=rowPad+rowH+90+rowPad;
  if(canvasEl.height!==Math.round(totalH*dpr)){
    canvasEl.width=Math.round(W*dpr);canvasEl.height=Math.round(totalH*dpr);
    canvasEl.style.width=W+'px';canvasEl.style.height=totalH+'px';
  }
  const ctx=canvasEl.getContext('2d');

  // consistent max val from original array
  var allVals=[];
  (fromStep.arr||[]).forEach(function(v){allVals.push(v);});
  (toStep.arr||[]).forEach(function(v){allVals.push(v);});
  const maxVal=Math.max.apply(null,allVals.concat([1]));

  var fromMap=msBuildPosMap(fromStep.groups||[],maxVal,W);
  var toMap=msBuildPosMap(toStep.groups||[],maxVal,W);

  // collect all origIdx keys
  var allIdxs=new Set([...Object.keys(fromMap).map(Number),...Object.keys(toMap).map(Number)]);
  var startTime=performance.now();

  function frame(now){
    var t=easeOut(Math.min((now-startTime)/dur,1));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,totalH);

    allIdxs.forEach(function(origIdx){
      var fp=fromMap[origIdx],tp=toMap[origIdx];
      if(!fp&&!tp)return;
      var src=fp||tp,dst=tp||fp;
      // bars leaving: fade out while sliding; bars arriving: fade in while sliding
      var alpha=fp&&tp?0.85:fp&&!tp?lerp(0.85,0,t):lerp(0,0.85,t);
      if(alpha<0.02)return;
      var cx=lerp(src.x,dst.x,t);
      var cbw=lerp(src.bw,dst.bw,t);
      var col=t>0.5?dst.col:src.col;
      var v=src.val;
      var bh=Math.max(18,Math.round((v/maxVal)*(rowH-40)));
      var y=rowPad+rowH-20-bh;
      ctx.save();ctx.fillStyle=col;ctx.globalAlpha=alpha;
      ctx.beginPath();ctx.roundRect(cx,y,cbw,bh,3);ctx.fill();
      ctx.globalAlpha=alpha;
      ctx.fillStyle=col;ctx.font='500 '+(cbw>24?11:9)+'px "DM Mono",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(v),cx+cbw/2,y-10);
      ctx.restore();
    });

    if(t<1)msAnimReq=requestAnimationFrame(frame);
    else{msAnimReq=null;if(onDone)onDone();}
  }
  msAnimReq=requestAnimationFrame(frame);
}

function msApplyStep(idx,onDone){
  if(idx<0||idx>=msSteps.length)return;
  const prev=msSteps[msStepIdx]||msSteps[0];
  msStepIdx=idx;
  const step=msSteps[idx];

  setLog('ms-log','['+(idx+1)+'/'+msSteps.length+'] '+step.msg,true);
  msHighlightPseudo(step.pseudoLine);
  document.getElementById('ms-prev').disabled=idx===0;
  document.getElementById('ms-next').disabled=idx===msSteps.length-1;
  updateDots('ms-dots',msSteps.length,idx);

  // animate if group layout changed
  const groupsChanged=JSON.stringify((prev.groups||[]).map(function(g){return g.lo+'-'+g.hi+'-'+g.bars.length;}))!==
                       JSON.stringify((step.groups||[]).map(function(g){return g.lo+'-'+g.hi+'-'+g.bars.length;}));
  if(groupsChanged&&prev.groups&&step.groups){
    const animDur=msSpeed>400?450:msSpeed>150?280:100;
    msAnimate(prev,step,animDur,function(){
      msDraw(step.arr,step);
      if(onDone) onDone();
    });
  } else {
    if(msAnimReq){cancelAnimationFrame(msAnimReq);msAnimReq=null;}
    msDraw(step.arr,step);
    if(onDone) onDone();
  }
}

function msHighlightPseudo(line){
  document.querySelectorAll('#ms-pseudo .line').forEach((el,i)=>el.classList.toggle('hi',i===line));
}
function msStep(dir){
  if(msAutoRunning){msAutoRunning=false;document.getElementById('ms-auto').textContent='Auto ▶';}

}
function msAuto(){
  if(msAutoRunning){msAutoRunning=false;document.getElementById('ms-auto').textContent='Auto ▶';return;}
  msAutoRunning=true;document.getElementById('ms-auto').textContent='Stop ■';
  function tick(){
    if(!msAutoRunning||msStepIdx>=msSteps.length-1){msAutoRunning=false;document.getElementById('ms-auto').textContent='Auto ▶';return;}
    const step=msSteps[msStepIdx+1];
    const prev=msSteps[msStepIdx];
    const groupsChanged=JSON.stringify((prev.groups||[]).map(function(g){return g.lo+'-'+g.hi+'-'+g.bars.length;}))!==
                         JSON.stringify((step.groups||[]).map(function(g){return g.lo+'-'+g.hi+'-'+g.bars.length;}));
    const animDur=groupsChanged?(msSpeed>400?450:msSpeed>150?280:100):0;
    const pause=Math.max(30,msSpeed-animDur);
    msApplyStep(msStepIdx+1,function(){setTimeout(tick,pause);});
  }
  tick();
}
function msReset(){msAutoRunning=false;document.getElementById('ms-auto').textContent='Auto ▶';msStepIdx=0;msApplyStep(0);}
function msSetSpeedRange(val){
  const t=val/100;
  msSpeed=Math.round(Math.pow(10,lerp(Math.log10(1000),Math.log10(20),t)));
  const lbl=document.getElementById('ms-speed-lbl');

}

let bsData=[], bsSteps=[], bsStepIdx=0, bsSpeed=600, bsAutoRunning=false;
const BS_COLORS={
  default:'rgba(79,142,247,.7)',
  sorted:'rgba(62,201,160,.7)',
  comparing:'rgba(240,160,48,.9)',
  swapping:'rgba(159,126,247,.9)',
};

function bsGenerate(){
  if(bsAutoRunning){bsAutoRunning=false;document.getElementById('bs-auto').textContent='Auto \u25B6';}
  const n=parseInt(document.getElementById('bs-size').value)||8;
  bsData=Array.from({length:Math.min(Math.max(n,4),16)},()=>Math.floor(Math.random()*90)+10);
  bsSteps=[];bsStepIdx=0;
  bsBuildSteps([...bsData]);
  mkC('bs-c',220);
  drawBarsAnimated('bs-c',bsData,bsData,{sorted:[],comparing:[],swapping:[]},{sorted:[],comparing:[],swapping:[]},BS_COLORS,1);
  setLog('bs-log','Array generated. N='+bsData.length+'. Bubble sort compares adjacent pairs and swaps if out of order.');
  document.getElementById('bs-prev').disabled=true;
  document.getElementById('bs-next').disabled=false;
  updateDots('bs-dots',bsSteps.length,0);
  bsHighlightPseudo(-1);
}

function bsBuildSteps(arr){
  const a=[...arr];
  const n=a.length;
  const sorted=[];
  bsSteps.push({arr:[...a],sorted:[],comparing:[],swapping:[],
    msg:'Starting bubble sort. Each pass compares neighboring elements and swaps them if out of order. The largest unsorted element bubbles to the end each pass.',
    pseudoLine:-1});
  for(let i=0;i<n-1;i++){
    let swappedAny=false;
    for(let j=0;j<n-1-i;j++){
      bsSteps.push({arr:[...a],sorted:[...sorted],comparing:[j,j+1],swapping:[],
        msg:'Pass '+(i+1)+': compare arr['+j+']='+a[j]+' and arr['+(j+1)+']='+a[j+1]+'. '+
          (a[j]>a[j+1]?a[j]+' > '+a[j+1]+' \u2014 out of order, swap.':a[j]+' \u2264 '+a[j+1]+' \u2014 already in order, move on.'),
        pseudoLine:1});
      if(a[j]>a[j+1]){
        swappedAny=true;
        bsSteps.push({arr:[...a],sorted:[...sorted],comparing:[],swapping:[j,j+1],
          msg:'Swapping '+a[j]+' and '+a[j+1]+'.',pseudoLine:2});
        [a[j],a[j+1]]=[a[j+1],a[j]];
        bsSteps.push({arr:[...a],sorted:[...sorted],comparing:[],swapping:[],
          msg:'Swapped. arr['+j+']='+a[j]+' and arr['+(j+1)+']='+a[j+1]+' are now in order.',pseudoLine:2});
      }
    }
    sorted.unshift(n-1-i);
    bsSteps.push({arr:[...a],sorted:[...sorted],comparing:[],swapping:[],
      msg:'End of pass '+(i+1)+'. '+a[n-1-i]+' has bubbled to its final position at index '+(n-1-i)+'.',
      pseudoLine:3});
    if(!swappedAny){
      bsSteps.push({arr:[...a],sorted:Array.from({length:n},(_,k)=>k),comparing:[],swapping:[],
        msg:'No swaps this pass \u2014 array is already sorted! Done early.',pseudoLine:4});
      return;
    }
  }
  bsSteps.push({arr:[...a],sorted:Array.from({length:n},(_,k)=>k),comparing:[],swapping:[],
    msg:'Done! Array fully sorted.',pseudoLine:4});
}

       <span id="bs-speed-lbl" style="font-family:var(--font-mono);font-size:11px;color:var(--text3);min-width:32px">fast</span>
     </div>
     <div style="margin-left:auto;display:flex;gap:4px" id="bs-dots"></div>`,
   canvas:'bs-c',ch:220,
   extra:`
     <div id="bs-pseudo" class="pseudo">
       <span class="line"><span class="kw">for</span> i = 0 <span class="kw">to</span> N−2:  <span class="cmt">// N−1 passes max</span></span>
       <span class="line">&nbsp;&nbsp;<span class="kw">for</span> j = 0 <span class="kw">to</span> N−2−i:  <span class="cmt">// shrinks each pass</span></span>
       <span class="line">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> arr[j] &gt; arr[j+1]: <span class="fn">swap</span>(arr[j], arr[j+1])  <span class="cmt">// out of order</span></span>
       <span class="line">&nbsp;&nbsp;<span class="cmt">// arr[N−1−i] is now in its final sorted position</span></span>
       <span class="line"><span class="cmt">// done (or exit early if no swaps this pass)</span></span>
     </div>
     <table class="complexity-table" style="margin-top:14px">
       <thead><tr><th>Case</th><th>Time</th><th>Why</th></tr></thead>
       <tbody>
         <tr><td>Best</td><td class="good">O(N)</td><td style="color:var(--text2)">Already sorted — one pass confirms no swaps needed, exit early</td></tr>
         <tr><td>Worst</td><td class="bad">O(N²)</td><td style="color:var(--text2)">Reverse sorted — maximum swaps every pass</td></tr>
         <tr><td>Average</td><td class="bad">O(N²)</td><td style="color:var(--text2)">About N²/2 comparisons on random data</td></tr>
         <tr><td>Space</td><td class="good">O(1)</td><td style="color:var(--text2)">Sorts in place, only needs one temp variable</td></tr>
       </tbody>
     </table>
     <div style="margin-top:16px">
       <div style="font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px">Key facts</div>
       <div style="display:flex;flex-direction:column;gap:8px">
         <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px">
           <div style="font-family:var(--font-mono);font-size:11px;color:#a8c8ff;margin-bottom:5px">How it works</div>
           <div style="font-family:var(--font-mono);font-size:13px;color:#ffc860;margin-bottom:6px">compare neighbors → swap if wrong order → repeat</div>
           <div style="font-size:13px;color:var(--text2);line-height:1.6">Walk through the array comparing arr[j] and arr[j+1]. If they’re out of order, swap. After each full pass, the largest unsorted element has bubbled all the way to the right into its final position — just like a bubble floating to the surface.</div>
         </div>
         <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px">
           <div style="font-family:var(--font-mono);font-size:11px;color:#a8c8ff;margin-bottom:5px">Why the inner loop shrinks each pass</div>
           <div style="font-family:var(--font-mono);font-size:13px;color:#ffc860;margin-bottom:6px">last i elements already sorted after pass i</div>
           <div style="font-size:13px;color:var(--text2);line-height:1.6">After pass 1, the largest is at index N−1 — no need to check it again. After pass 2, the two largest are sorted. The inner loop shrinks by 1 each pass, saving unnecessary comparisons.</div>
         </div>
         <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px">
           <div style="font-family:var(--font-mono);font-size:11px;color:#a8c8ff;margin-bottom:5px">Early exit</div>
           <div style="font-family:var(--font-mono);font-size:13px;color:#ffc860;margin-bottom:6px">no swaps in a pass → already sorted → stop</div>
           <div style="font-size:13px;color:var(--text2);line-height:1.6">If a full pass completes with zero swaps, the array is already sorted. Stop early. This gives bubble sort O(N) best case on already-sorted input.</div>
         </div>
         <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px">
           <div style="font-family:var(--font-mono);font-size:11px;color:#7de8c8;margin-bottom:5px">Stable</div>
           <div style="font-size:13px;color:var(--text2);line-height:1.6">Only swaps when arr[j] &gt; arr[j+1] — equal elements never swap, so their relative order is always preserved.</div>
         </div>
         <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px">
           <div style="font-family:var(--font-mono);font-size:11px;color:#c4adff;margin-bottom:5px">Scaling rule — O(N²)</div>
           <div style="font-family:var(--font-mono);font-size:13px;color:#ffc860;margin-bottom:6px">(kN)² / N² = k²</div>
           <div style="font-size:13px;color:var(--text2);line-height:1.6">Double the elements → 4× slower. Same scaling as selection and insertion sort worst case.</div>
         </div>
       </div>
     </div>`,
   log:'bs-log',logDef:'Generate an array and step through the sort.',
   callout:'<strong>Key idea:</strong> each pass guarantees the largest unsorted element lands at the end. The inner loop shrinks each pass because those end elements are already done. If a whole pass has no swaps, stop early — the array is sorted.',
   init:()=>bsGenerate()}
);

let current=SECTIONS[0].id;
function switchTo(id){
  current=id;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id==='p-'+id));
  const s=SECTIONS.find(x=>x.id===id);
  if(s)setTimeout(()=>{s.init();setLog(s.log,s.logDef);},30);
}

const navEl=document.getElementById('nav');
const panelsEl=document.getElementById('panels');
SECTIONS.forEach(s=>{
  const ni=document.createElement('div');
  ni.className='nav-item'+(s.id===current?' active':'');
  ni.dataset.id=s.id;
  ni.innerHTML=`<span style="font-size:16px;width:22px;text-align:center">${s.icon}</span>${s.label}`;
  ni.onclick=()=>switchTo(s.id);
  navEl.appendChild(ni);

  const p=document.createElement('div');
  p.className='panel'+(s.id===current?' active':'');
  p.id='p-'+s.id;
  p.innerHTML=`
    <div class="ph">
      <div class="ph-row"><span style="font-size:26px">${s.icon}</span><h2 class="ph-title">${s.label}</h2><span class="ph-badge">${s.badge}</span></div>
      <p class="ph-desc">${s.desc}</p>
    </div>
    <div class="ctrls">${s.controls}</div>
    <div class="scene"><canvas id="${s.canvas}"></canvas></div>
    <div class="log" id="${s.log}">${s.logDef}</div>
    ${s.extra||''}
    <div class="callout">${s.callout}</div>`;

  panelsEl.appendChild(p);
});

window.addEventListener('load',()=>{
  const s=SECTIONS.find(x=>x.id===current);
  if(s){s.init();setLog(s.log,s.logDef);}
});
window.addEventListener('resize',()=>{
  const s=SECTIONS.find(x=>x.id===current);if(s)s.init();
});
</script></body>
</html>
